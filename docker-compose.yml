services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: tripmap:dev
    container_name: tripmap
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      STATIC_DIR: /app/static
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:8000"]'
      DATABASE_URL: postgresql+asyncpg://tripmap:tripmap@db:5432/tripmap
      # Local dev has no OIDC provider — bypass auth and run as a fixed local
      # user. This stack is for local testing only; never use it in production.
      DEV_AUTH: "true"
      # Optional — set MAPY_API_KEY in your shell (or a root .env) to try the
      # Mapy.com base layer locally; blank leaves the map on OpenStreetMap.
      MAPY_API_KEY: ${MAPY_API_KEY:-}
      ZONE_SUBDIVISION_COUNTRIES: ${ZONE_SUBDIVISION_COUNTRIES:-}
      IMMICH_BASE_URL: ${IMMICH_BASE_URL:-}
      IMMICH_PUBLIC_URL: ${IMMICH_PUBLIC_URL:-}
      YOUTRACK_BASE_URL: ${YOUTRACK_BASE_URL:-}
      YOUTRACK_API_TOKEN: ${YOUTRACK_API_TOKEN:-}
      YOUTRACK_PROJECT_ID: ${YOUTRACK_PROJECT_ID:-}
    volumes:
      # `:z` relabels the host dir with the shared container SELinux label so
      # the non-root user inside the container can read it on Fedora/RHEL.
      - ./backend/app:/app/app:ro,z
    command:
      ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  db:
    image: postgis/postgis:16-3.4
    container_name: tripmap-db
    environment:
      POSTGRES_USER: tripmap
      POSTGRES_PASSWORD: tripmap
      POSTGRES_DB: tripmap
    ports:
      - "5432:5432"
    volumes:
      - tripmap-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripmap -d tripmap"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- End-to-end test stack (`--profile e2e`) -------------------------------
  # Started by Playwright (frontend/playwright.config.ts) and fully isolated from
  # the dev stack above: its own database on tmpfs, so every run starts empty and
  # nothing touches dev data, seeded with the fixtures the suite relies on.
  e2e-app:
    profiles: [e2e]
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: tripmap:e2e
    depends_on:
      e2e-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://tripmap:tripmap@e2e-db:5432/tripmap_e2e
      DEV_AUTH: "true"
      # Nothing listens here: a map-click location is created without region
      # codes instead of the suite depending on the public Nominatim instance.
      NOMINATIM_BASE_URL: http://127.0.0.1:9
    # The entrypoint applies migrations first, then this seeds and starts the app.
    command:
      - sh
      - -c
      - python -m app.scripts.seed_e2e && exec uvicorn app.main:app --host 0.0.0.0 --port 8000

  e2e-db:
    profiles: [e2e]
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: tripmap
      POSTGRES_PASSWORD: tripmap
      POSTGRES_DB: tripmap_e2e
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      # Over TCP: during first-time init the image runs a socket-only server
      # that a plain pg_isready would already report as ready.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U tripmap -d tripmap_e2e"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  tripmap-db-data:
